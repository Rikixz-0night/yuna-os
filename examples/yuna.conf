# Example Yuna OS install plan.
# Copy, edit, then run:  sudo yunainstall --config ./yuna.conf --yes
# Preview it first with:  yunainstall --dry-run --config ./yuna.conf
disk=/dev/nvme0n1
hostname=yuna
username=yuna
password=change-me
# root_password=also-change-me
timezone=Asia/Phnom_Penh
locale=en_US.UTF-8
keymap=us
filesystem=btrfs
kernel=linux
desktop=hyprland
drivers=auto
bootloader=systemd-boot
swap=zram
encrypt=true
esp_mib=512
