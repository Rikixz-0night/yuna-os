# Yuna OS live initramfs.
#
# `archiso` and `archiso_loop_mnt` come from mkinitcpio-archiso: without them
# the live medium cannot find and mount the squashfs image, so the ISO would
# boot into a rescue shell instead of the installer.
HOOKS=(base udev microcode modconf memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
