LABEL yuna
TEXT HELP
Boot Yuna OS (Cambodia Anime Edition) live medium.
Live user: yuna (pass: yuna) | Root (pass: yuna).
Default Singapore mirror & Cambodia timezone (Asia/Phnom_Penh).
ENDTEXT
MENU LABEL Yuna OS Live (%ARCH%, BIOS) - Default
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL yuna_ram
TEXT HELP
Copy Yuna OS completely into RAM for ultra-fast operation and removable USB.
Requires at least 4 GiB of RAM.
ENDTEXT
MENU LABEL Yuna OS Live (%ARCH%, BIOS, Copy to ^RAM)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y %KERNEL_PARAMS%

LABEL yuna_no_modeset
TEXT HELP
Boot Yuna OS with basic fallback display (nomodeset).
Use this if you encounter a blank screen on startup.
ENDTEXT
MENU LABEL Yuna OS Live (%ARCH%, BIOS, ^Safe Graphics)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset %KERNEL_PARAMS%
