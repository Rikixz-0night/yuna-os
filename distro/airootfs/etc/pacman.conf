#
# Yuna OS - pacman configuration on the live system and on installed systems.
# The offline [yuna] repository ships our own packages.
#
[options]
HoldPkg = pacman glibc
Architecture = auto
Color
ParallelDownloads = 10
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 32-bit packages (Steam, Wine, ...). Uncomment both lines to enable.
#[multilib]
#Include = /etc/pacman.d/mirrorlist

[yuna]
Server = file:///opt/yuna/repo
SigLevel = Optional TrustAll
