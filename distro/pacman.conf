#
# Yuna OS - pacman configuration used while building the ISO.
# @YUNA_REPO@ and @YUNA_CACHE@ are substituted by scripts/build-iso.sh.
#
[options]
HoldPkg = pacman glibc
Architecture = auto
Color
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional
CacheDir = @YUNA_CACHE@
CacheDir = /var/cache/pacman/pkg

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[yuna]
Server = file://@YUNA_REPO@
SigLevel = Optional TrustAll
